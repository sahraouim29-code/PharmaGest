<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PharmaGestion</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f6fa;
  color: #243247;
}
header {
  background: #087f70;
  color: white;
  padding: 22px;
  text-align: center;
}
main {
  padding: 20px;
  max-width: 900px;
  margin: auto;
}
.card {
  background: white;
  padding: 20px;
  margin-bottom: 15px;
  border-radius: 12px;
  box-shadow: 0 2px 8px #00000010;
}
h2 { color: #087f70; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(140px,1fr));
  gap: 12px;
}
button {
  border: 0;
  border-radius: 8px;
  padding: 14px;
  background: #087f70;
  color: white;
  font-size: 15px;
}
</style>
</head>
<body>
<header>
  <h1>PharmaGestion</h1>
  <p>Gestion intelligente de votre pharmacie</p>
</header>
<main>
  <section class="card">
    <h2>Tableau de bord</h2>
    <p>Bienvenue dans votre espace de gestion.</p>
  </section>
  <section class="card">
    <h2>Modules</h2>
    <div class="grid">
      <button>Médicaments</button>
      <button>Stock</button>
      <button>Achats</button>
      <button>Ventes</button>
      <button>Fournisseurs</button>
      <button>Rapports</button>
    </div>
  </section>
</main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = 'https://ktymtpqkykidsivsxipb.supabase.co';

const SUPABASE_KEY = 'sb_publishable_LVPYXeyt_jr9EhwyF5c9uw_AqLnLBXu';

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const status = document.createElement('p');
status.style.textAlign = 'center';
status.style.padding = '12px';
status.textContent = 'Supabase : client initialisé';

document.querySelector('main').appendChild(status);

window.pharmaDB = db;
  db.from('pharmacies')
  .select('name')
  .then(({ data, error }) => {
    if (error) {
      status.textContent = 'Erreur Supabase : ' + error.message;
    } else {
      status.textContent = 'Connexion réussie à Supabase';
    }
  });
</script>
</body>
</html>
