<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PharmaGest</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f6fa;
  color: #243247;
}
header {
  background: #087f70;
  color: white;
  padding: 22px;
  text-align: center;
}
main {
  padding: 20px;
  max-width: 900px;
  margin: auto;
}
.card {
  background: white;
  padding: 20px;
  margin-bottom: 15px;
  border-radius: 12px;
  box-shadow: 0 2px 8px #00000010;
}
h2 { color: #087f70; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(140px,1fr));
  gap: 12px;
}
button {
  border: 0;
  border-radius: 8px;
  padding: 14px;
  background: #087f70;
  color: white;
  font-size: 15px;
}
</style>
</head>
<body>
<header>
  <h1>PharmaGest</h1>
  <p>Gestion intelligente de votre pharmacie</p>
</header>
<main>
  <section class="card">
    <h2>Tableau de bord</h2>
    <p>Bienvenue dans votre espace de gestion.</p>
  </section>
  <section class="card">
    <h2>Modules</h2>
    <div class="grid">
      <button>Médicaments</button>
      <button>Stock</button>
      <button>Achats</button>
      <button>Ventes</button>
      <button>Fournisseurs</button>
      <button>Rapports</button>
    </div>
  </section>
</main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = 'https://ktymtpqkykidsivsxipb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_LVPYXeyt_jr9EhwyF5c9uw_AqLnLBXu';

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

window.pharmaDB = db;

const main = document.querySelector('main');
const logout = document.createElement('button');
logout.textContent = 'Déconnexion';
logout.hidden = true;
logout.type = 'button';
main.appendChild(logout);
const login = document.createElement('section');
login.className = 'card';
login.innerHTML = `
  <h2>Connexion</h2>
  <form id="loginForm">
    <p>
      <input id="email" type="email"
        placeholder="Adresse e-mail" required
        style="width:90%;padding:12px">
    </p>
    <p>
      <input id="password" type="password"
        placeholder="Mot de passe" required
        style="width:90%;padding:12px">
    </p>
    <button type="submit">Se connecter</button>
  </form>
  <p id="status">Veuillez vous connecter.</p>
  <button id="logout" type="button" hidden>
    Déconnexion
  </button>
`;

main.appendChild(login);
  const medicines = document.createElement('section');
medicines.className = 'card';
medicines.innerHTML = `
  <h2>Médicaments</h2>
  <form id="medicineForm">
    <input id="medName" placeholder="Nom du médicament" required>
    <input id="medDCI" placeholder="DCI">
    <input id="medDosage" placeholder="Dosage">
    <input id="medForm" placeholder="Forme pharmaceutique">
    <input id="medLab" placeholder="Laboratoire">
    <button type="submit">Ajouter médicament</button>
  </form>
  <p id="medicineStatus"></p>
  <div id="medicineList"></div>
`;
main.appendChild(medicines);
  medicines.style.display = 'none';

async function loadMedicines() {
  const { data, error } = await db
    .from('medicaments')
    .select('id,name,dci,dosage,pharmaceutical_form,laboratory')
    .order('name');

  if (error) {
    document.getElementById('medicineStatus').textContent =
      'Erreur : ' + error.message;
    return;
  }

  document.getElementById('medicineList').innerHTML =
    data.map(m => `
      <div class="card">
        <strong>${m.name}</strong><br>
        ${m.dci || ''} — ${m.dosage || ''}<br>
        ${m.pharmaceutical_form || ''} — ${m.laboratory || ''}
      </div>
    `).join('');
}

document.getElementById('medicineForm')
.addEventListener('submit', async (event) => {
  event.preventDefault();

  const { data: { user } } = await db.auth.getUser();

  const { data: member, error: memberError } = await db
    .from('pharmacy_members')
    .select('pharmacy_id')
    .eq('user_id', user.id)
    .single();

  if (memberError || !member) {
    document.getElementById('medicineStatus').textContent =
      'Erreur : pharmacie introuvable';
    return;
  }

  const { error } = await db.from('medicaments').insert({
    pharmacy_id: member.pharmacy_id,
    name: document.getElementById('medName').value,
    dci: document.getElementById('medDCI').value,
    dosage: document.getElementById('medDosage').value,
    pharmaceutical_form: document.getElementById('medForm').value,
    laboratory: document.getElementById('medLab').value
  });

  if (error) {
    document.getElementById('medicineStatus').textContent =
      'Erreur : ' + error.message;
    return;
  }

  document.getElementById('medicineStatus').textContent =
    'Médicament ajouté avec succès';

  event.target.reset();
  loadMedicines();
});

const status = document.getElementById('status');
async function checkDatabase() {
  const { data, error } = await db
    .from('pharmacies')
    .select('name')
    .limit(1);

  if (error) {
    status.textContent = 'Erreur : ' + error.message;
  } else {
    status.textContent = data.length
      ? 'Connexion réussie : ' + data[0].name
      : 'Aucune pharmacie trouvée.';
  }
}

document.getElementById('loginForm')
  .addEventListener('submit', async (event) => {
    event.preventDefault();

    status.textContent = 'Connexion en cours...';

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    const { error } = await db.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      status.textContent = 'Erreur : ' + error.message;
      return;
    }

    login.style.display = 'none';
logout.hidden = false;
medicines.style.display = 'block';
await checkDatabase();
logout.addEventListener('click', async () => {
  await db.auth.signOut();

  login.style.display = 'block';
  medicines.style.display = 'none';
  logout.hidden = true;

  status.textContent = 'Vous êtes déconnecté.';
});
(async () => {
  const { data } = await db.auth.getSession();

  if (data.session) {
    medicines.style.display = 'block';
loadMedicines();
    logout.hidden = false;
    medicines.style.display = 'block';
    await checkDatabase();
  }
})();

</script>
</body>
</html>
